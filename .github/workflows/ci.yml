name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # opencv-python (non-headless) needs libGL at import time on a display-less
  # Linux runner; harmless elsewhere.
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,video,server]"
      - run: python -m ruff check .
      - run: python -m mypy

  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: system deps for opencv-python
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,video,server]"
      - name: unit + component tests (deselect the headless integration check)
        run: python -m pytest -m "not integration"

  integration:
    name: headless integration (bundled ~5s sample clip)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: system deps for opencv-python
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,video,server]"
      - name: run the bundled-clip CLI pipeline (track -> solve -> stabilize)
        run: python -m pytest -m integration -v
      - name: also exercise `stable sample` exactly as a user would run it
        run: |
          stable sample ./sample-out
          test -s ./sample-out/clip.mp4
          test -s ./sample-out/tracks.json
          test -s ./sample-out/curves.csv
          test -s ./sample-out/stabilized.mp4

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    name: package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [unit, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the frontend into the package (stable/server/webdist)
        shell: bash
        run: |
          cd web && npm ci && cd ..
          python scripts/build_frontend.py
      - name: build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # This is PLAN.md's Phase 6 acceptance criterion, run for real: a clean
      # venv with nothing but the wheel installed (no source checkout on
      # PYTHONPATH, no Node.js needed) runs `stable serve` and answers both
      # the API and the built UI.
      - name: install the wheel into a clean venv (fresh-machine simulation)
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ -f smoke-venv/bin/pip ]; then echo "BIN=smoke-venv/bin" >> "$GITHUB_ENV"
          else echo "BIN=smoke-venv/Scripts" >> "$GITHUB_ENV"; fi
      - name: stable --version / stable trackers
        shell: bash
        run: |
          "$BIN/pip" install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          "$BIN/pip" install "${WHEEL}[server,video]"
          # A console-script entry point never puts the cwd on sys.path, so
          # this genuinely only ever sees the installed site-packages copy --
          # no need to cd away from the repo's own stable/ source directory.
          "$BIN/stable" --version
          "$BIN/stable" trackers
      - name: stable serve answers the API and serves the built UI
        shell: bash
        run: |
          mkdir -p smoke-workspace
          export STABLE_WORKSPACE_DIR="$PWD/smoke-workspace"
          "$BIN/stable" serve --port 8123 --no-browser --no-build &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/api/health
          curl -sf http://127.0.0.1:8123/api/models | grep -q '"models"'
          curl -sf http://127.0.0.1:8123/ | grep -qi '<div id="root">'
